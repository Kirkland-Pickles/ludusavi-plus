on:
  - push
  - pull_request
  - workflow_dispatch

name: Main

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: win64
            artifact-file: ludusavi.exe
            tar: false
          - os: windows-latest
            rust-target: i686-pc-windows-msvc
            artifact-name: win32
            artifact-file: ludusavi.exe
            tar: false
          - os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: linux
            artifact-file: ludusavi
            tar: true
          - os: macos-14
            rust-target: aarch64-apple-darwin
            artifact-name: mac
            artifact-file: ludusavi
            tar: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mtkennerly/dunamai-action@v1
        with:
          env-var: LUDUSAVI_VERSION
          args: --style semver
      - uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.rust-target }}
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust-target }}
      - if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: sudo apt-get update && sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev
      - run: cargo build --release --target ${{ matrix.rust-target }}
      - if: ${{ matrix.artifact-name == 'mac' }}
        run: bash tests/package-macos-app.sh
      - if: ${{ matrix.artifact-name == 'mac' }}
        run: >
          scripts/package-macos-app.sh
          target/${{ matrix.rust-target }}/release/${{ matrix.artifact-file }}
          ${{ env.LUDUSAVI_VERSION }}
          target/${{ matrix.rust-target }}/release/ludusavi-v${{ env.LUDUSAVI_VERSION }}-${{ matrix.artifact-name }}
          target/${{ matrix.rust-target }}/release/ludusavi-v${{ env.LUDUSAVI_VERSION }}-${{ matrix.artifact-name }}.tar.gz
      - if: ${{ matrix.tar && matrix.artifact-name != 'mac' }}
        run: |
          cd target/${{ matrix.rust-target }}/release
          tar --create --gzip --file=ludusavi-v${{ env.LUDUSAVI_VERSION }}-${{ matrix.artifact-name }}.tar.gz ${{ matrix.artifact-file }}
      - if: ${{ matrix.tar }}
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-v${{ env.LUDUSAVI_VERSION }}-${{ matrix.artifact-name }}
          path: target/${{ matrix.rust-target }}/release/ludusavi-v${{ env.LUDUSAVI_VERSION }}-${{ matrix.artifact-name }}.tar.gz
          if-no-files-found: error
      - if: ${{ !matrix.tar }}
        run: cp "target/${{ matrix.rust-target }}/release/${{ matrix.artifact-file }}" "target/${{ matrix.rust-target }}/release/ludusavi-${{ matrix.artifact-name }}.exe"
      - if: ${{ !matrix.tar }}
        uses: actions/upload-artifact@v4
        with:
          name: ludusavi-v${{ env.LUDUSAVI_VERSION }}-${{ matrix.artifact-name }}
          path: target/${{ matrix.rust-target }}/release/ludusavi-${{ matrix.artifact-name }}.exe
          if-no-files-found: error

  test:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - name: Prepare native test tools
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, subprocess, urllib.request, zipfile, io
          system = {"Windows": "windows", "Linux": "linux", "macOS": "osx"}[os.environ["RUNNER_OS"]]
          arch = "arm64" if os.environ["RUNNER_ARCH"] == "ARM64" else "amd64"
          checksums = {
              "windows-amd64": "4fe815f944b2c47c8a051020e8913728acc9bcf64df8bb85634399d9a1234cdd",
              "linux-amd64": "ab9fa5877cee91c64fdfd61a27028a458cf618b39259e5c371dc2ec34a12e415",
              "osx-amd64": "37e50641cd736de296b8aca8149e607b9923b357d79abb902e89c4cdb1fcc790",
              "osx-arm64": "d1cea838b618f9b4f15984748502232684e92ff0b90e3c4c8bd91ac21f4d8695",
          }
          name = f"rclone-v1.71.2-{system}-{arch}"
          data = urllib.request.urlopen(f"https://github.com/rclone/rclone/releases/download/v1.71.2/{name}.zip", timeout=60).read()
          assert hashlib.sha256(data).hexdigest() == checksums[f"{system}-{arch}"], "Rclone checksum mismatch"
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ludusavi-test-tools"
          root.mkdir()
          zipfile.ZipFile(io.BytesIO(data)).extractall(root)
          suffix = ".exe" if system == "windows" else ""
          rclone = root / name / f"rclone{suffix}"
          rclone.chmod(0o755)
          helper = root / f"game{suffix}"
          subprocess.run(["rustc", "tests/process-helper.rs", "-o", str(helper)], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LUDUSAVI_TEST_GAME={helper.as_posix()}\nLUDUSAVI_TEST_RCLONE={rclone.as_posix()}\n")
          PY
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev xvfb dbus-x11 libxkbcommon0 libxkbcommon-x11-0
      - if: ${{ matrix.os == 'windows-latest' }}
        run: reg import tests/ludusavi.reg
      - if: ${{ matrix.os == 'windows-latest' }}
        run: |
          cd tests/root3/game5 && cmd /c "mklink /J data-symlink data"
      - if: ${{ matrix.os != 'windows-latest' }}
        run: |
          cd tests/root3/game5 && ln -s data data-symlink
      - if: ${{ startsWith(matrix.os, 'macos-') }}
        run: |
          clang -std=c11 -fobjc-arc -Wall -Wextra -Werror -framework AppKit -framework Foundation tests/macos-reopen.m -o "$RUNNER_TEMP/ludusavi-reopen-test"
          "$RUNNER_TEMP/ludusavi-reopen-test"
      - run: cargo test --locked -- --include-ignored
      - run: cargo build --locked
      - if: ${{ matrix.os == 'windows-latest' }}
        run: python tests/background-app.py target/debug/ludusavi.exe "$env:LUDUSAVI_TEST_GAME" --normal-launch
      - if: ${{ matrix.os == 'windows-latest' }}
        run: python tests/windows-launch.py target/debug/ludusavi.exe
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: xvfb-run -a dbus-run-session -- python tests/background-app.py target/debug/ludusavi "$LUDUSAVI_TEST_GAME"
      - if: ${{ startsWith(matrix.os, 'macos-') }}
        run: python tests/background-app.py target/debug/ludusavi "$LUDUSAVI_TEST_GAME"

  lint:
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- --deny warnings

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            architecture: x64
            binary: ludusavi.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            platform: windows
            architecture: x86
            binary: ludusavi.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x64
            binary: ludusavi
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            architecture: arm64
            binary: ludusavi
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x64
            binary: ludusavi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.target }}
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw 'Inno Setup checksum mismatch'
          }
          $innoDir = Join-Path $env:RUNNER_TEMP 'inno'
          $process = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$innoDir`"")
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
          "ISCC=$innoDir\ISCC.exe" >> $env:GITHUB_ENV
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/package-installer.py ${{ matrix.platform }} target/${{ matrix.target }}/release/${{ matrix.binary }} --architecture ${{ matrix.architecture }}
      - if: matrix.platform == 'windows' && matrix.architecture == 'x64'
        run: python tests/windows-installer.py target/${{ matrix.target }}/release/${{ matrix.binary }} "$env:ISCC" --user-data
      - if: matrix.platform == 'macos'
        run: bash tests/package-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ludusavi-installer-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ludusavi-v*-win*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: ludusavi-installer-windows-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: release-assets/*
